# Basalt's calculator: qalc, the Qalculate! CLI. On its own, and as the
# launcher's inline maths (quickshell's Launcher.qml runs `qalc -t -- …`), so
# these settings decide what the launcher shows.
#
# USING IT. qalc reads $XDG_CONFIG_HOME/qalculate/qalc.cfg and nothing else
# (`-f` runs a file of commands, it does not select a config): link this as
# ~/.config/qalculate/qalc.cfg. From Nix, the module wraps qalc with
# XDG_CONFIG_HOME pointing at a directory holding it; qalc spawns no children
# and keeps its history under XDG_STATE_HOME, so nothing else is hidden.
#
# Autosave is off (save_config, save_mode_on_exit, save_definitions_on_exit):
# qalc would otherwise rewrite this file on every exit.

[General]
auto_update_exchange_rates=-1
base_display=1
binary_bits=0
clear_history_on_exit=0
colorize=1
comma_as_separator=0
decimal_comma=-1
digit_grouping=0
division_sign=0
dot_as_separator=-1
duodecimal_symbols=0
excessive_parenthesis=0
exp_display=1
hexadecimal_twos_complement=0
hexadecimal_twos_complement_input=0
ignore_locale=0
imaginary_j=0
lower_case_numbers=0
multiplication_sign=2
save_config=0
save_definitions_on_exit=0
save_mode_on_exit=0
short_multiplication=1
spacious=1
spell_out_logical_operators=1
twos_complement=1
twos_complement_input=0
use_unicode_exponents=1
use_unicode_signs=1
version=5.13.2
vertical_space=1

[Mode]
abbreviate_names=1
all_prefixes_enabled=0
allow_complex=1
allow_infinite=1
angle_unit=1
approximation=-1
assume_denominators_nonzero=1
auto_post_conversion=3
calculate_as_you_type=0
calculate_functions=1
calculate_variables=1
caret_as_xor=0
complex_number_form=0
concise_uncertainty_input=0
default_assumption_sign=0
default_assumption_type=4
denominator_prefix_enabled=1
functions_enabled=1
in_rpn_mode=0
indicate_infinite_series=0
interval_arithmetic=1
interval_calculation=1
interval_display=0
limit_implicit_multiplication=0
local_currency_conversion=1
max_deci=2
min_deci=0
min_exp=-1
mixed_units_conversion=3
negative_exponents=0
number_base=10
number_base_expression=10
number_fraction_format=-1
parsing_mode=0
place_units_separately=1
precision=10
read_precision=0
rounding_mode=0
rpn_syntax=0
show_ending_zeroes=1
simplified_percentage=-1
sort_minus_last=1
structuring=1
sync_units=1
units_enabled=1
unknownvariables_enabled=0
use_binary_prefixes=0
use_max_deci=0
use_min_deci=0
use_prefixes=1
use_prefixes_for_all_units=0
use_prefixes_for_currencies=0
variable_units_enabled=1
variables_enabled=1
warn_about_denominators_assumed_nonzero=1
