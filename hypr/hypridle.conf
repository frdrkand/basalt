# Basalt's idle handling: the lock path and the sleep hook, which every host
# wants the same. What idling does (lock after a while, or blank a screen that
# is already locked) is the host's choice, so a host's own hypridle.conf
# sources this and adds a listener:
#
#   source = ./basalt/hypridle.conf
#
#   # Lock after five minutes idle:
#   listener {
#       timeout = 300
#       on-timeout = loginctl lock-session
#   }
#
#   # Or: never lock on a timer, but blank the monitors once locked:
#   listener {
#       timeout = 300
#       on-timeout = basalt-dpms off-if-locked
#       on-resume = basalt-dpms on
#   }
#
# Read the block below as four claims:
#
#   lock_cmd         answers logind's Lock signal, which is the one way in for
#                    every lock: SUPER+L and the power menu run
#                    `loginctl lock-session`, as does before_sleep_cmd. It
#                    never stacks a second hyprlock on an already locked
#                    session.
#   before_sleep_cmd asks logind to lock, which comes back as lock_cmd.
#   inhibit_sleep=2  is the point of the block. hypridle holds logind's delay
#                    inhibitor until the compositor reports the session
#                    actually locked (hyprland-lock-notify-v1), not merely until
#                    before_sleep_cmd returns, which is mode 1 and would
#                    suspend behind a lock screen not yet painted. If that
#                    report never arrives the failure is bounded, not a hang:
#                    logind gives up at InhibitDelayMaxSec (5s by default).
#   after_sleep_cmd  relights the monitors. basalt-dpms says "on" as a table,
#                    so it is idempotent rather than a toggle; see bin/.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = basalt-dpms on
    inhibit_sleep = 2
}
