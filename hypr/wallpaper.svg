<svg
   width="1920"
   height="1080"
   viewBox="0 0 507.99999 285.75001"
   class="nix-wp"
   xmlns="http://www.w3.org/2000/svg">
  <style>
    /* The only two colors. `--wp-bg` / `--wp-logo` (set on an ancestor at
       runtime, e.g. by the theme-creator preview) override the fallbacks;
       without them the file renders in the rice palette — base00 background,
       base03 logo.

       The fallbacks must be literal hex, NOT a second custom property:
       librsvg (the rasterizer behind `magick wallpaper.svg …`) honours a
       var() fallback but cannot resolve a custom property declared on an
       ancestor, so a nested var() fallback renders as black. */
    .nix-wp .bg   { fill: var(--wp-bg, #141817); }
    .nix-wp .logo { fill: var(--wp-bg, #141817); stroke: var(--wp-logo, #6e7371); }
  </style>
