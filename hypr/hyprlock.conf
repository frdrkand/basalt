# Basalt's lock screen: the clock, the date and your name over the frosted
# wallpaper, and a boxy password field. Styled to the design system's lock kit
# (no bounding card; the field near-square and accent-outlined, not a pill).
#
# The shared look, without a background: a host's own hyprlock.conf sources the
# palette and this, then adds the parts that are its own (the background
# image, an auth block for a fingerprint reader):
#
#   source = ./basalt/palette.conf     # or a palette of the host's own
#   source = ./basalt/hyprlock.conf
#
#   background {
#       monitor =
#       path = ~/.config/hypr/basalt/lockscreen.png
#   }
#
# Every lock is meant to come through hypridle's lock_cmd (hypridle.conf), so
# SUPER+L, the power menu and suspend all lock the same way.

general {
    hide_cursor = true
}

# The same short ease-out as Hyprland (look-and-feel.lua). Without this block
# hyprlock uses its own slow linear fades, so the screen visibly lags behind
# SUPER+L and unlocking drags. `speed` is in 100ms units.
animations {
    enabled = true
    bezier = dsOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 1.2, dsOut
    animation = fadeOut, 1, 1.2, dsOut
    animation = inputFieldDots, 1, 1.2, dsOut
}

# The clock: text-display (56), base07, with a soft shadow to stay legible on
# any wallpaper.
label {
    monitor =
    text = $TIME
    font_family = $fontUi
    font_size = 56
    color = rgb($base07)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(00000088)
    position = 0, 120
    halign = center
    valign = center
}

# The date: text-title (17), fg-primary.
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_family = $fontUi
    font_size = 17
    color = rgb($base06)
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(00000077)
    position = 0, 64
    halign = center
    valign = center
}

# The user: text-title-lg (22), fg-emphasis. $DESC is the GECOS name, so this
# greets the name a login screen shows rather than the login name; the sed
# drops the empty trailing GECOS fields some tools write ("Name,,,").
label {
    monitor =
    text = cmd[update:0] echo "$DESC" | sed 's/,*$//'
    font_family = $fontUi
    font_size = 22
    color = rgb($base07)
    shadow_passes = 1
    shadow_size = 6
    shadow_color = rgba(00000077)
    position = 0, 8
    halign = center
    valign = center
}

# The password field: radius-lg (4), base03 outline, base02 surface, base07
# text. Check base03, fail red, caps lock yellow. The doubled '#' is
# hyprlang's escape for a literal one, which would otherwise start a comment.
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 4
    dots_center = true
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb($base03)
    inner_color = rgb($base02)
    font_color = rgb($base07)
    check_color = rgb($base03)
    fail_color = rgb($base08)
    capslock_color = rgb($base0A)
    placeholder_text = <span foreground="##$base04">Password</span>
    fade_on_empty = false
    position = 0, -48
    halign = center
    valign = center
}
