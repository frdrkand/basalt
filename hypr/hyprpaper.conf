# Basalt's wallpaper: one image on every monitor, cover-fitted. An empty
# `monitor` is hyprpaper's wildcard, so a monitor plugged in later gets it too
# and nothing here names a connector.
#
# A host's own hyprpaper.conf says which image, then sources this:
#
#   $wallpaper = ~/.config/hypr/basalt/wallpaper.png
#   source = ./basalt/hyprpaper.conf
#
# wallpaper.png is Basalt's wallpaper.svg in its own palette, rendered at
# 5120x2880: the SVG's 16:9, big enough that a cover fit only ever scales it
# down, up to a 5K2K ultrawide, which it crops. The Nix lib's `wallpaper`
# renders the SVG in any palette, at any size.

splash = false

wallpaper {
    monitor =
    path = $wallpaper
    fit_mode = cover
}
