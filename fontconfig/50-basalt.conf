<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Basalt's default faces: Onest for everything proportional, Hack Nerd Font
     Mono for the terminal and mono content, Noto for what those two lack (CJK,
     emoji). The fonts themselves are the host's to install.

     Link this into ~/.config/fontconfig/conf.d/. The Nix module sets the same
     defaults through fonts.fontconfig.defaultFonts, and `nix flake check`
     holds the faces here to theme.json. -->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Onest</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Hack Nerd Font Mono</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
