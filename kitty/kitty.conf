# Basalt's terminal: kitty. SUPER+Q opens it, and it hosts yazi (SUPER+E, and
# folders opened through applications/yazi-open.desktop).
#
# USING IT. Link this as ~/.config/kitty/kitty.conf; a host's own settings go in
# ~/.config/kitty/kitty.d/*.conf, which the last line includes, so they win.
# (From Nix, the module builds the same layout and points KITTY_CONFIG_DIRECTORY
# at it.)
#
# THE PALETTE is written out literally (Basalt's theme.json, held to it by
# `nix flake check`); the Nix lib recolours a copy for another palette.
# See https://sw.kovidgoyal.net/kitty/conf.html

# ---- typography: the mono face, at the shared base size ----
font_family Hack Nerd Font Mono
font_size 11

window_padding_width 8

# An underscore rather than the default block.
cursor_shape underline

# nixpkgs builds kitty with "no-rc" as the default, because on NixOS
# home-manager sources the integration from zshrc. Nothing here does, so let
# kitty inject it itself. Without it kitty cannot tell a bare prompt from a
# running command, and closing a window always asks first.
shell_integration enabled

# ---- the base16 palette ----
# ANSI slots follow the canonical base16 map (1=base08 … 7=base05, 8=base03,
# 9..15 the bright repeats and base07), so terminal *content* keeps the full
# hue ramp. The chrome (selection, tabs, borders) uses the monochrome base03
# accent instead of a hue.
#
# Slot 0 is base01, not base00: a literal transcription of an older theme
# file, kept so the terminal looks unchanged.
color0  #222725
color1  #ff615d
color2  #39ba5a
color3  #bd9903
color4  #579ff9
color5  #ce74dc
color6  #20b1bf
color7  #cdd0cf
color8  #6e7371
color9  #ff615d
color10 #39ba5a
color11 #bd9903
color12 #579ff9
color13 #ce74dc
color14 #20b1bf
color15 #f2f4f3

# Opaque base00 background, base07 text; no transparency.
background #141817
foreground #f2f4f3
cursor #e1e3e2
cursor_text_color #141817
cursor_trail_color #cdd0cf
selection_background #6e7371
selection_foreground #f2f4f3
url_color #579ff9

active_border_color #6e7371
inactive_border_color #222725
active_tab_background #6e7371
active_tab_foreground #f2f4f3
inactive_tab_background #222725
inactive_tab_foreground #cdd0cf

# ---- the host's own ----
globinclude kitty.d/*.conf
