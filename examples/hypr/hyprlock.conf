# A host's hyprlock.conf: Basalt's palette and look, then this machine's
# background (and, say, a fingerprint reader).
source = ./basalt/palette.conf
source = ./basalt/hyprlock.conf

background {
    monitor =
    path = ~/.config/hypr/basalt/lockscreen.png
}

auth {
    pam:enabled = true
    fingerprint:enabled = false
}
