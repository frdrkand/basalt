[erlang]
format = "\\[[$symbol($version)]($style)\\]"

[gcloud]
format = "\\[[$symbol$account(@$domain)(\\($region\\))]($style)\\]"

[git_branch]
format = "[ $symbol$branch ]($style)[](fg:#959998)"
style = "fg:#39ba5a"

[git_status]
format = "([ $all_status$ahead_behind ]($style)[](#959998))"
style = "fg:#ff615d"

[golang]
format = "\\[[$symbol($version)]($style)\\]"

[haskell]
format = "\\[[$symbol($version)]($style)\\]"

[helm]
format = "\\[[$symbol($version)]($style)\\]"

[hg_branch]
