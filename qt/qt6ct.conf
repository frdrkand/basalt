# Selects Basalt's Qt palette and style. qt6ct (and qt5ct) read this from
# ~/.config/qt6ct/qt6ct.conf and want an absolute path to the colour scheme,
# which differs per machine, so a host renders it with @COLORS@ replaced by
# where base16.conf is (the Nix module does; so does a link script with sed).
# Qt programs read it when QT_QPA_PLATFORMTHEME=qt6ct.
[Appearance]
style=Fusion
custom_palette=true
color_scheme_path=@COLORS@
icon_theme=Papirus-Dark
standard_dialogs=default
